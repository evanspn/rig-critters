[package]
name = "critters"
version = "0.1.0"
edition = "2024"
description = "Your OpenRig agents as little pixel animals, working: a Ratatui terminal scene (kitty graphics or half-blocks) driven by the live state of each seat"
license = "MIT"
repository = "https://github.com/evanspn/rig-critters"
readme = "README.md"
keywords = ["openrig", "tui", "ratatui", "pixel-art", "agents"]
categories = ["command-line-utilities"]
rust-version = "1.88"

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
clap = { version = "4", features = ["derive"] }
flate2 = "1.1.10"
gif = "0.13"
image = { version = "0.25.10", default-features = false, features = ["png"] }
ratatui = "0.30.2"
serde_json = "1.0.151"
toml = "1.1.6"

[dev-dependencies]
portable-pty = "0.9"
tempfile = "3.27.0"
